modules:
  - name: example
    description: 可執行的 billing 參考服務，組裝 HTTP、MQ、task 與 cron 三種程序
    paths:
      - example/**
    keywords:
      - Invoice
      - InvoiceController
      - billing
      - bootstrap
      - wiring
      - consumer
      - task_worker
    aliases:
      - 參考服務
      - 發票
      - 組裝
    rationale: 獨立 workspace member，示範服務如何使用 kernel 實作單一 bounded context
    relationships:
      depends_on:
        - kernel
        - template
        - plugin
      used_by: []
    last_verified: 2026-11-06T14:29:19.994Z
    source_digest: source-v1:74b28e44c0d7680537f7d2394f2c7b52d235b88006aebc7a54ce5e67755e5ead
  - name: kernel
    description: 可安裝的 DDD 共用套件，提供 core、adapter、port 與 devtools
    paths:
      - kernel/**
    keywords:
      - fast_ddd
      - fast_ddd_adapter
      - fast_ddd_port
      - fast_ddd_devtools
      - SessionProvider
      - RepositoryBase
      - MessageModel
      - TaskRegistry
    aliases:
      - 共用核心
      - 交易
      - 租戶隔離
      - 訊息契約
    rationale: 單一發佈套件集中處理跨服務基礎行為，四個 Python package 由 import contracts 分層
    relationships:
      depends_on: []
      used_by:
        - example
        - template
    last_verified: 2026-11-06T15:20:56.196Z
    source_digest: source-v1:9cf93aaaf0a68b64690574b59f95820befa22f83c80bd5cebc2478cd3a74278c
  - name: template
    description: 產生可直接客製化的單服務骨架，驗證更新合併與框架 example 漂移
    paths:
      - template/**
      - copier.yml
      - scripts/**
      - Makefile
      - ruff.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/check.yml
      - docs/template-operations.md
    keywords:
      - Copier
      - copy
      - update
      - recopy
      - drift
      - Docker
    aliases:
      - 服務骨架
      - 客製化
      - 漂移檢查
    rationale: 將生成與驗收工具獨立於服務業務與 kernel runtime，外層程式歸各服務擁有
    relationships:
      depends_on:
        - kernel
      used_by:
        - example
        - plugin
    last_verified: 2026-11-06T14:29:19.994Z
    source_digest: source-v1:2894d671fd6b4a9175797a76db79762d95a888dc86e1613d1a7b935dc3b6f61f
  - name: plugin
    description: 以 Claude Code、Codex 與 agy 共用的 plugin 交付只能手動呼叫的 fast-ddd-init
    paths:
      - .claude-plugin/**
      - plugin.json
      - skills/**
    keywords:
      - fast-ddd-init
      - marketplace
      - plugin.json
      - SKILL.md
      - openai.yaml
    aliases:
      - 三家 plugin
      - 建立服務
      - 手動觸發
    rationale: repo 根目錄即 plugin（source "./"），以三份 manifest 對應各 host，只暴露建立服務的 skill
    relationships:
      depends_on:
        - template
      used_by:
        - example
    last_verified: 2026-10-20T17:14:56.624Z
