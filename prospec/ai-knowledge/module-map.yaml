modules:
  - name: example
    description: 可執行的 billing 參考服務，組裝 HTTP、MQ、task 與 cron 三種程序
    paths:
      - example/**
    keywords:
      - Invoice
      - InvoiceController
      - billing
      - bootstrap
      - wiring
      - consumer
      - task_worker
    aliases:
      - 參考服務
      - 發票
      - 組裝
    rationale: 獨立 workspace member，示範服務如何使用 kernel 實作單一 bounded context
    relationships:
      depends_on:
        - kernel
        - template
        - plugin
      used_by: []
    last_verified: 2026-11-06T06:42:41.956Z
    source_digest: source-v1:c5e939c47fdea48bb04d67522e9b46bc537941a479ceb35ddd9d1734cee30a59
  - name: kernel
    description: 可安裝的 DDD 共用套件，提供 core、adapter、port 與 devtools
    paths:
      - kernel/**
    keywords:
      - fast_ddd
      - fast_ddd_adapter
      - fast_ddd_port
      - fast_ddd_devtools
      - SessionProvider
      - RepositoryBase
      - MessageModel
      - TaskRegistry
    aliases:
      - 共用核心
      - 交易
      - 租戶隔離
      - 訊息契約
    rationale: 單一發佈套件集中處理跨服務基礎行為，四個 Python package 由 import contracts 分層
    relationships:
      depends_on: []
      used_by:
        - example
        - template
    last_verified: 2026-11-06T08:38:05.446Z
    source_digest: source-v1:afe143afb26815019b921e413ea30f0bcbd2dd1089cda65b53f263872a8277db
  - name: template
    description: 產生可直接客製化的單服務骨架，驗證更新合併與框架 example 漂移
    paths:
      - template/**
      - copier.yml
      - scripts/**
      - Makefile
      - ruff.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/check.yml
      - docs/template-operations.md
    keywords:
      - Copier
      - copy
      - update
      - recopy
      - drift
      - Docker
    aliases:
      - 服務骨架
      - 客製化
      - 漂移檢查
    rationale: 將生成與驗收工具獨立於服務業務與 kernel runtime，外層程式歸各服務擁有
    relationships:
      depends_on:
        - kernel
      used_by:
        - example
        - plugin
    last_verified: 2026-11-06T06:42:41.956Z
    source_digest: source-v1:eb2195c2b9cfd91319311209aa8605d9032a7c7718c991fad3f4aa39627d0cde
  - name: plugin
    description: 以 Claude Code、Codex 與 agy 共用的 plugin 交付只能手動呼叫的 fast-ddd-init
    paths:
      - .claude-plugin/**
      - plugin.json
      - skills/**
    keywords:
      - fast-ddd-init
      - marketplace
      - plugin.json
      - SKILL.md
      - openai.yaml
    aliases:
      - 三家 plugin
      - 建立服務
      - 手動觸發
    rationale: repo 根目錄即 plugin（source "./"），以三份 manifest 對應各 host，只暴露建立服務的 skill
    relationships:
      depends_on:
        - template
      used_by:
        - example
    last_verified: 2026-10-20T17:14:56.624Z
