modules:
  - name: example
    description: 可執行的 billing 參考服務，組裝 HTTP、MQ、task 與 cron 三種程序
    paths:
      - example/**
    keywords:
      - Invoice
      - InvoiceController
      - billing
      - bootstrap
      - wiring
      - consumer
      - task_worker
    aliases:
      - 參考服務
      - 發票
      - 組裝
    rationale: 獨立 workspace member，示範服務如何使用 kernel 實作單一 bounded context
    relationships:
      depends_on:
        - kernel
        - template
        - plugin
      used_by: []
    last_verified: 2026-11-07T13:45:00.810Z
    source_digest: source-v1:011dd298333f8906e7ea0f95c438ffc23430d02d9e3f3ca4126f078be123f916
  - name: kernel
    description: 可安裝的 DDD 共用套件，提供 core、adapter、port 與 devtools
    paths:
      - kernel/**
    keywords:
      - fast_ddd
      - fast_ddd_adapter
      - fast_ddd_port
      - fast_ddd_devtools
      - SessionProvider
      - RepositoryBase
      - MessageModel
      - TaskRegistry
      - push_after_commit
      - mount_realtime
    aliases:
      - 共用核心
      - 交易
      - 租戶隔離
      - 訊息契約
      - 即時推播
    rationale: 單一發佈套件集中處理跨服務基礎行為，四個 Python package 由 import contracts 分層
    relationships:
      depends_on: []
      used_by:
        - example
        - template
    last_verified: 2026-11-07T07:52:53.697Z
    source_digest: source-v1:48f71dce3159382fa04cb3546912f234e798eab93dfbc0c31e9f3169bf9a23f2
  - name: template
    description: 產生可直接客製化的單服務骨架，驗證更新合併與框架 example 漂移
    paths:
      - template/**
      - copier.yml
      - scripts/**
      - Makefile
      - ruff.toml
      - uv.lock
      - .pre-commit-config.yaml
      - .github/workflows/check.yml
      - docs/template-operations.md
    keywords:
      - Copier
      - copy
      - update
      - recopy
      - drift
      - Docker
    aliases:
      - 服務骨架
      - 客製化
      - 漂移檢查
    rationale: 將生成與驗收工具獨立於服務業務與 kernel runtime，外層程式歸各服務擁有
    relationships:
      depends_on:
        - kernel
      used_by:
        - example
        - plugin
    last_verified: 2026-11-07T13:45:00.810Z
    source_digest: source-v1:5577260cf74c8206b9fcc90effa1a59fd4e98a287b128c6d5137885df170da9e
  - name: plugin
    description: 以 Claude Code、Codex 與 agy 共用的 plugin 交付只能手動呼叫的 fast-ddd-init
    paths:
      - .claude-plugin/**
      - plugin.json
      - skills/**
    keywords:
      - fast-ddd-init
      - marketplace
      - plugin.json
      - SKILL.md
      - openai.yaml
    aliases:
      - 三家 plugin
      - 建立服務
      - 手動觸發
    rationale: repo 根目錄即 plugin（source "./"），以三份 manifest 對應各 host，只暴露建立服務的 skill
    relationships:
      depends_on:
        - template
      used_by:
        - example
    last_verified: 2026-10-20T17:14:56.624Z
